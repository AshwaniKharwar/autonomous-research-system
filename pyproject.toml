[project]
name = "research-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.1",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.38",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
